<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Before They Go Off the Shelf</title>

    <link rel="stylesheet" href="Style3.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<section class="featured">

    <div class="heading">
        <h2>Buy Before They Go Off the Shelf</h2>

        <div class="arrows">
            <i class="fa-solid fa-circle-chevron-left"></i>
            <i class="fa-solid fa-circle-chevron-right"></i>
        </div>
    </div>

    <div class="product-container">

        <!-- Brownie -->
        <div class="card">
            <img src="images/Brownie.jpeg" alt="Brownie">

            <div class="rating">
                <span>⭐ 4.9</span>
                <i class="fa-regular fa-heart"></i>
            </div>

            <h3>Chocolate Brownie</h3>
            <p>Freshly Baked</p>
            <h4>₹149</h4>

            <span class="stock">Only 3 Left</span>

            <button>Add to Cart</button>
        </div>

        <!-- Iced Coffee -->
        <div class="card">
            <img src="images/icedcoffee.jpeg" alt="Iced Coffee">

            <div class="rating">
                <span>⭐ 4.8</span>
                <i class="fa-regular fa-heart"></i>
            </div>

            <h3>Iced Coffee</h3>
            <p>Cold Brew</p>
            <h4>₹179</h4>

            <span class="stock">Only 4 Left</span>

            <button>Add to Cart</button>
        </div>

        <!-- Seasonal Dessert -->
        <div class="card">
            <img src="images/seasonaldessert.jpeg" alt="Seasonal Dessert">

            <div class="rating">
                <span>⭐ 4.7</span>
                <i class="fa-regular fa-heart"></i>
            </div>

            <h3>Seasonal Dessert</h3>
            <p>Chef's Special</p>
            <h4>₹229</h4>

            <span class="stock">Only 2 Left</span>

            <button>Add to Cart</button>
        </div>

        <!-- Nachos -->
        <div class="card">
            <img src="images/Nachos.jpeg" alt="Nachos">

            <div class="rating">
                <span>⭐ 4.8</span>
                <i class="fa-regular fa-heart"></i>
            </div>

            <h3>Loaded Nachos</h3>
            <p>Cheesy & Crispy</p>
            <h4>₹199</h4>

            <span class="stock">Only 5 Left</span>

            <button>Add to Cart</button>
        </div>

    </div>

</section>

</body>
</html>

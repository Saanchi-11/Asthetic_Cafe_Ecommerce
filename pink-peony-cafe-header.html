<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pink Peony Cafe — Shopping List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 40px 20px;
    background: linear-gradient(180deg, #fff5f7 0%, #ffe9ef 100%);
    font-family: 'Montserrat', sans-serif;
    display: flex;
    justify-content: center;
  }

  .header-card {
    width: 100%;
    max-width: 520px;
    background: #ffffff;
    border-radius: 20px;
    padding: 36px 30px 28px;
    box-shadow: 0 10px 30px rgba(214, 51, 108, 0.12);
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .header-card::before,
  .header-card::after {
    content: "🌸";
    position: absolute;
    font-size: 28px;
    opacity: 0.5;
  }
  .header-card::before { top: 14px; left: 18px; }
  .header-card::after  { bottom: 14px; right: 18px; transform: scaleX(-1); }

  .cafe-name {
    font-family: 'Great Vibes', cursive;
    font-style: italic;
    font-size: 58px;
    color: #d6336c;
    margin: 6px 0 4px;
    text-shadow: 1px 1px 0 rgba(214,51,108,0.15);
  }

  .divider {
    width: 90px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #f2a6c1, transparent);
    margin: 8px auto 14px;
  }

  .subtitle {
    letter-spacing: 3px;
    text-transform: uppercase;
    font-size: 12px;
    font-weight: 600;
    color: #b5527a;
    margin: 0;
  }

  .list-title {
    margin-top: 22px;
    font-size: 15px;
    font-weight: 500;
    color: #8a5468;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

  <div class="header-card">
    <h1 class="cafe-name">Pink Peony Cafe</h1>
    <div class="divider"></div>
    <p class="subtitle">Fresh &middot; Cozy &middot; Handpicked</p>
    <p class="list-title">🛍️ Shopping List</p>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#fff7fb;
padding:40px;
}

.checkout-container{
max-width:1100px;
margin:auto;
}

.checkout-container h1{
text-align:center;
margin-bottom:30px;
color:#d84f84;
}

.checkout-grid{
display:grid;
grid-template-columns:2fr 1fr;
gap:30px;
}

.customer-details,
.payment-box{
background:#fff;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.customer-details h2,
.payment-box h2{
margin-bottom:20px;
color:#d84f84;
}

label{
display:block;
margin-top:15px;
font-weight:600;
}

input,
textarea{
width:100%;
padding:12px;
margin-top:8px;
border:1px solid #ddd;
border-radius:8px;
outline:none;
}

textarea{
resize:none;
height:90px;
}

.summary p,
.summary h3{
display:flex;
justify-content:space-between;
margin:12px 0;
}

.payment-method{
margin-top:15px;
}

.payment-method label{
display:block;
padding:12px;
margin-bottom:10px;
border:1px solid #ddd;
border-radius:8px;
cursor:pointer;
transition:.3s;
}

.payment-method label:hover{
background:#ffe8f2;
}

.payment-method i{
margin-right:10px;
color:#d84f84;
}

.card-details{
display:none;
margin-top:20px;
padding:15px;
background:#fafafa;
border-radius:10px;
}

.card-row{
display:flex;
gap:15px;
}

.card-row div{
flex:1;
}

.pay-btn{
width:100%;
margin-top:20px;
padding:15px;
background:#d84f84;
color:#fff;
border:none;
border-radius:10px;
font-size:17px;
cursor:pointer;
}

.pay-btn:hover{
background:#c23872;
}

/* Popup */

.popup{
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
justify-content:center;
align-items:center;
}

.popup-content{
background:white;
padding:35px;
border-radius:15px;
width:350px;
text-align:center;
}

.popup-content i{
font-size:70px;
color:green;
margin-bottom:15px;
}

.popup-content button{
margin-top:20px;
padding:12px 35px;
background:#d84f84;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

@media(max-width:768px){

.checkout-grid{
grid-template-columns:1fr;
}

.card-row{
flex-direction:column;
}

}

</style>

</head>

<body>

<div class="checkout-container">

<h1>Checkout</h1>

<div class="checkout-grid">

<div class="customer-details">

<h2>Payer Details</h2>

<form id="checkoutForm">

<label>Full Name</label>
<input type="text" id="name" placeholder="Enter your name"
required pattern="[A-Za-z ]{3,40}">

<label>Email</label>
<input type="email" id="email" placeholder="Enter email"
required>

<label>Phone Number</label>
<input type="tel" id="phone"
placeholder="Enter mobile number"
required pattern="[6-9][0-9]{9}">

<label>Delivery Address</label>
<textarea id="address"
placeholder="Enter address"
required minlength="10"></textarea>

</form>

</div>

<div class="payment-box">

<h2>Order Summary</h2>

<div class="summary">

<p>Items Total <span>₹1750</span></p>

<p>Delivery <span>₹40</span></p>

<p>GST <span>₹110</span></p>

<hr>

<h3>Total <span>₹1890</span></h3>

</div>

<h2>Select Payment Method</h2>

<div class="payment-method">

<label>
<input type="radio" name="payment" onclick="hideCard()" checked>
<i class="fa-solid fa-money-bill-wave"></i>
Cash on Delivery
</label>

<label>
<input type="radio" name="payment" onclick="hideCard()">
<i class="fa-brands fa-google-pay"></i>
Google Pay
</label>

<label>
    <input type="radio" name="payment" onclick="showUPI()">
    <i class="fa-solid fa-qrcode"></i>
    UPI
</label>
<div>
    <div class="upi-details" id="upiDetails">

<label>UPI ID</label>

<input type="text"
id="upi"
placeholder="example@oksbi"
pattern="[A-Za-z0-9._-]+@[A-Za-z]+">

<p class="upi-note">
Enter your UPI ID to receive the payment request.
</p>

</div>

<label>
<input type="radio" name="payment" onclick="hideCard()">
<i class="fa-solid fa-building-columns"></i>
Net Banking
</label>

<label>
<input type="radio" name="payment" onclick="showCard()">
<i class="fa-regular fa-credit-card"></i>
Credit / Debit Card
</label>

</div>

<div class="card-details" id="cardDetails">

<label>Card Number</label>
<input type="text" id="cardNumber"
placeholder="1234 5678 9012 3456"
maxlength="19"
pattern="[0-9 ]{19}">

<label>Card Holder Name</label>
<input type="text" id="cardHolder"
placeholder="John Doe"
pattern="[A-Za-z ]{3,40}">

<div class="card-row">

<div>
<label>Expiry Date</label>
<input type="text" id="expiry"
placeholder="MM/YY"
pattern="(0[1-9]|1[0-2])\/[0-9]{2}">
</div>

<div>
<label>CVV</label>
<input type="password" id="cvv"
maxlength="3"
pattern="[0-9]{3}"
placeholder="123">
</div>

</div>

</div>




<label>CVV</label>
<input type="password" maxlength="3" placeholder="123">

</div>

</div>

</div>

<button class="pay-btn" onclick="paymentDone(event)">
Pay Now
</button>

</div>

</div>

</div>

<div class="popup" id="popup">

<div class="popup-content">

<i class="fa-solid fa-circle-check"></i>

<h2>Payment Successful</h2>

<p>Your order has been placed successfully.</p>
<a href="Done.html">
<button onclick="goHome()">
OK
</button>
</a>

</div>

</div>

<script>

function paymentDone() {

    if (!document.getElementById("checkoutForm").checkValidity()) {
        document.getElementById("checkoutForm").reportValidity();
        return;
    }

    if (document.getElementById("cardDetails").style.display === "block") {

        if (!document.getElementById("cardNumber").checkValidity()) {
            document.getElementById("cardNumber").reportValidity();
            return;
        }

        if (!document.getElementById("cardHolder").checkValidity()) {
            document.getElementById("cardHolder").reportValidity();
            return;
        }

        if (!document.getElementById("expiry").checkValidity()) {
            document.getElementById("expiry").reportValidity();
            return;
        }

        if (!document.getElementById("cvv").checkValidity()) {
            document.getElementById("cvv").reportValidity();
            return;
        }
    }

    if (document.getElementById("upiDetails").style.display === "block") {

        if (!document.getElementById("upi").checkValidity()) {
            document.getElementById("upi").reportValidity();
            return;
        }
    }

    document.getElementById("popup").style.display = "flex";
}

</script>

</body>
</html>
